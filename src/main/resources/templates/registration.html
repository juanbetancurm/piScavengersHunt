<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiDay IJR</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="institution-header">
        <img src="/images/logo.png" alt="Instituto Jorge Robledo Logo">
        <div class="app-title">IJR PiPuzzle 2025</div>
    </div>
    <div class="card">
        <h1>Pi Puzzle Game</h1>
        <p>Welcome to the Pi Adventure! Register your team to start the game.</p>

        <form action="/register" method="post">
            <div class="form-group">
                <label for="teamName">Team Name:</label>
                <input type="text" id="teamName" name="teamName" required>
            </div>

            <div class="form-group">
                <label for="gradeClass">Grade/Class:</label>
                <input type="text" id="gradeClass" name="gradeClass" required>
            </div>

            <div class="form-group">
                <label for="memberNames">Team Member Names:</label>
                <textarea id="memberNames" name="memberNames" rows="4" required></textarea>
            </div>

            <button type="submit" class="primary-button">Start Adventure</button>
        </form>
    </div>
</div>
<footer>
    <div class="institution-label">Instituto Jorge Robledo - Colegio laico, mixto y privado</div>
</footer>
</body>
</html>
