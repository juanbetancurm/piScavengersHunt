<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiDay IJR</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="institution-header">
        <img src="/images/logo.png" alt="Instituto Jorge Robledo Logo">
        <div class="app-title">IJR PiPuzzle 2025</div>
    </div>
    <div class="card">
        <h1>Puzzle <span th:text="${puzzleNumber}">1</span></h1>

        <div class="question-box">
            <p th:text="${puzzle.question}">Question goes here?</p>
        </div>

        <form action="/submit-answer" method="post">
            <div class="options-group">
                <div class="option">
                    <input type="radio" id="optionA" name="selectedOption" value="A" required>
                    <label for="optionA" th:text="${puzzle.optionA}">Option A</label>
                </div>

                <div class="option">
                    <input type="radio" id="optionB" name="selectedOption" value="B">
                    <label for="optionB" th:text="${puzzle.optionB}">Option B</label>
                </div>

                <div class="option">
                    <input type="radio" id="optionC" name="selectedOption" value="C">
                    <label for="optionC" th:text="${puzzle.optionC}">Option C</label>
                </div>

                <div class="option">
                    <input type="radio" id="optionD" name="selectedOption" value="D">
                    <label for="optionD" th:text="${puzzle.optionD}">Option D</label>
                </div>
            </div>

            <button type="submit" class="primary-button">Submit Answer</button>
        </form>
    </div>
</div>
<footer>
    <div class="institution-label">Instituto Jorge Robledo - Colegio laico, mixto y privado</div>
</footer>
</body>
</html>
