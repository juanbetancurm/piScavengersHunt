<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiDay IJR</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="institution-header">
        <img src="/images/logo.png" alt="Instituto Jorge Robledo Logo">
        <div class="app-title">IJR PiPuzzle 2025</div>
    </div>
    <div class="card">
        <h1>PiDay Challenge Leaderboard</h1>

        <div class="leaderboard">
            <table class="leaderboard-table">
                <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team</th>
                    <th>Grade/Class</th>
                    <th>Points</th>
                    <th>Time</th>
                    <th>Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry, status : ${entries}">
                    <td th:text="${status.count}">1</td>
                    <td th:text="${entry.teamName}">Team Name</td>
                    <td th:text="${entry.gradeClass}">Grade/Class</td>
                    <td th:text="${entry.totalPoints}">25</td>
                    <td th:text="${entry.formattedTime}">2 min 30 sec</td>
                    <td th:text="${#temporals.format(entry.completionDate, 'dd-MM-yyyy')}">01-01-2025</td>
                </tr>
                </tbody>
            </table>
        </div>

        <a href="/" class="primary-button">Back to Home</a>
    </div>
</div>
<footer>
    <div class="institution-label">Instituto Jorge Robledo - Colegio laico, mixto y privado</div>
</footer>
</body>
</html>
