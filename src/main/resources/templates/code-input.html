<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiDay IJR</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="institution-header">
        <img src="/images/logo.png" alt="Instituto Jorge Robledo Logo">
        <div class="institution-label">Instituto Jorge Robledo - Colegio laico, mixto y privado</div>
    </div>
    <div class="card">
        <h1>Puzzle <span th:text="${puzzleNumber}">1</span>: Enter the Code</h1>

        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form action="/check-code" method="post">
            <div class="form-group">
                <label for="code">Enter the code you found:</label>
                <input type="text" id="code" name="code" required>
            </div>

            <button type="submit" class="primary-button">Check Code</button>
        </form>

        <a href="/code-hint" class="secondary-button">Back to Hint</a>
    </div>
</div>
</body>
</html>
